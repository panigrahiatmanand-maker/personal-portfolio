
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        .form-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        input {
            width: 18%;
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .search {
            width: 100%;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 13px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f5f9;
        }

        .delete {
            background: #dc2626;
        }

        .edit {
            background: #16a34a;
        }

        .total {
            margin-top: 20px;
            color: #1e3a8a;
        }

        @media(max-width: 750px) {
            input {
                width: 100%;
                margin: 5px 0;
            }

            .container {
                padding: 15px;
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>
    <p class="subtitle">Manage Student Records Easily</p>

    <div class="form-box">

        <h2>Add Student</h2>

        <input type="number" id="sid" placeholder="Student ID">

        <input type="text" id="name" placeholder="Student Name">

        <input type="number" id="age" placeholder="Age">

        <input type="text" id="dept" placeholder="Department">

        <input type="number" id="marks" placeholder="Marks">

        <button onclick="addStudent()">Add Student</button>

    </div>

    <input type="text" id="search" class="search"
    placeholder="Search Student by ID or Name..."
    oninput="displayStudents()">

    <h2 style="margin-top:25px;">Student Records</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>

    </table>

    <h3 class="total" id="total">Total Students: 0</h3>

</div>

<script>

    let students = JSON.parse(
        localStorage.getItem("students")
    ) || [];

    function saveData() {
        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );
    }

    function getGrade(marks) {

        if (marks >= 90) return "A";
        if (marks >= 75) return "B";
        if (marks >= 60) return "C";
        if (marks >= 40) return "D";

        return "Fail";
    }

    function addStudent() {

        let id = document.getElementById("sid").value.trim();
        let name = document.getElementById("name").value.trim();
        let age = document.getElementById("age").value;
        let dept = document.getElementById("dept").value.trim();
        let marks = document.getElementById("marks").value;

        if (!id || !name || !age || !dept || marks === "") {
            alert("Please fill all fields!");
            return;
        }

        if (students.some(s => s.id === id)) {
            alert("Student ID already exists!");
            return;
        }

        if (!Number.isInteger(Number(age)) ||
            Number(age) <= 0 ||
            !Number.isFinite(Number(marks)) ||
            Number(marks) < 0 ||
            Number(marks) > 100) {

            alert("Enter valid age and marks!");
            return;
        }

        let student = {
            id: id,
            name: name,
            age: Number(age),
            dept: dept,
            marks: Number(marks)
        };

        students.push(student);

        saveData();
        displayStudents();

        document.getElementById("sid").value = "";
        document.getElementById("name").value = "";
        document.getElementById("age").value = "";
        document.getElementById("dept").value = "";
        document.getElementById("marks").value = "";

        alert("Student Added Successfully!");
    }

    function displayStudents() {

        let list = document.getElementById("studentList");

        let search = document.getElementById("search")
        .value.toLowerCase();

        list.innerHTML = "";

        let filtered = students.filter(s =>
            s.name.toLowerCase().includes(search) ||
            s.id.toLowerCase().includes(search)
        );

        filtered.forEach(s => {

            let row = document.createElement("tr");

            [s.id, s.name, s.age, s.dept,
             s.marks, getGrade(s.marks)].forEach(value => {

                let cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);

            });

            let actions = document.createElement("td");

            let edit = document.createElement("button");
            edit.textContent = "Edit";
            edit.className = "edit";
            edit.onclick = () => editStudent(s.id);

            let del = document.createElement("button");
            del.textContent = "Delete";
            del.className = "delete";
            del.onclick = () => deleteStudent(s.id);

            actions.appendChild(edit);
            actions.appendChild(del);

            row.appendChild(actions);

            list.appendChild(row);

        });

        document.getElementById("total").textContent =
            "Total Students: " + students.length;
    }

    function editStudent(id) {

        let s = students.find(s => s.id === id);

        let name = prompt("Enter new name:", s.name);
        if (name === null) return;

        let age = prompt("Enter new age:", s.age);
        if (age === null) return;

        let dept = prompt("Enter new department:", s.dept);
        if (dept === null) return;

        let marks = prompt("Enter new marks:", s.marks);
        if (marks === null) return;

        if (!name.trim() || !dept.trim() ||
            !Number.isInteger(Number(age)) ||
            Number(age) <= 0 ||
            marks.trim() === "" ||
            !Number.isFinite(Number(marks)) ||
            Number(marks) < 0 ||
            Number(marks) > 100) {

            alert("Invalid Details!");
            return;
        }

        s.name = name.trim();
        s.age = Number(age);
        s.dept = dept.trim();
        s.marks = Number(marks);

        saveData();
        displayStudents();

        alert("Student Updated Successfully!");
    }

    function deleteStudent(id) {

        if (confirm("Are you sure you want to delete this student?")) {

            students = students.filter(s => s.id !== id);

            saveData();
            displayStudents();

            alert("Student Deleted Successfully!");
        }
    }

    displayStudents();

</script>

</body>
</html>
